# Nginx reverse proxy for Serafinna (RU VPS)
# Install: copy to /etc/nginx/sites-available/serafinna.ru
#   ln -s /etc/nginx/sites-available/serafinna.ru /etc/nginx/sites-enabled/
#   certbot --nginx -d serafinna.ru -d www.serafinna.ru
#
# App listens on 127.0.0.1:3000 (docker compose or npm start)

upstream serafinna_next {
    server 127.0.0.1:3000;
    keepalive 32;
}

# Redirect apex → www (or reverse — pick one canonical)
server {
    listen 80;
    listen [::]:80;
    server_name serafinna.ru www.serafinna.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.serafinna.ru$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.serafinna.ru serafinna.ru;

    # certbot will fill these:
    # ssl_certificate     /etc/letsencrypt/live/serafinna.ru/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/serafinna.ru/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 12m;

    # Long cache for immutable Next assets
    location /_next/static/ {
        proxy_pass http://serafinna_next;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /images/ {
        proxy_pass http://serafinna_next;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
    }

    location / {
        proxy_pass http://serafinna_next;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # Avoid buffering issues that look like "hanging" downloads
        proxy_buffering on;
        proxy_request_buffering on;
        proxy_read_timeout 120s;
    }
}
